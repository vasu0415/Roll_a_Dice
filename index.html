<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roll a Dice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      font-family: 'Poppins', sans-serif;
      color: #f8fafc;
      padding: 20px;
      background-image: url(images.jpg);
    }

    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 24px;
      font-weight: 700;
    }

    .dice-container {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      
    }

    .dice {
      width: 110px;
      height: 110px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3), inset 0 -4px 6px rgba(0, 0, 0, 0.1);
      display: grid;
      padding: 14px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
    }

    .dice:hover {
      transform: scale(1.04);
    }

    /* The shake animation played when rolling */
    .rolling {
      animation: rollShake 0.6s ease-in-out;
    }

    @keyframes rollShake {
      0% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-25deg) translateY(-10px) scale(1.08); }
      40% { transform: rotate(20deg) translateY(-6px); }
      60% { transform: rotate(-15deg) translateY(-2px); }
      80% { transform: rotate(10deg); }
      100% { transform: rotate(0deg) scale(1); }
    }

    /* Dots (Pips) */
    .pip {
      width: 18px;
      height: 18px;
      background: #1e1b4b;
      border-radius: 50%;
      align-self: center;
      justify-self: center;
    }

    /* Standard 3x3 layout patterns for numbers 1 to 6 */
    /* Face 1: Center dot is red */
    .face-1 {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face-1 .pip {
      width: 22px;
      height: 22px;
      background: #ef4444;
    }

    /* Face 2 */
    .face-2 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .face-2 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face-2 .pip:nth-child(2) { grid-area: 2 / 2; }

    /* Face 3 */
    .face-3 {
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
    }
    .face-3 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face-3 .pip:nth-child(2) { grid-area: 2 / 2; }
    .face-3 .pip:nth-child(3) { grid-area: 3 / 3; }

    /* Face 4 */
    .face-4 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    /* Face 5 */
    .face-5 {
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
    }
    .face-5 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face-5 .pip:nth-child(2) { grid-area: 1 / 3; }
    .face-5 .pip:nth-child(3) { grid-area: 2 / 2; }
    .face-5 .pip:nth-child(4) { grid-area: 3 / 1; }
    .face-5 .pip:nth-child(5) { grid-area: 3 / 3; }

    /* Face 6 */
    .face-6 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 4px;
    }

    .result-text {
      font-size: 1.25rem;
      font-weight: 600;
      color: #94a3b8;
      min-height: 32px;
      margin-bottom: 20px;
    }

    .result-text span {
      color: #38bdf8;
      font-size: 1.4rem;
      font-weight: 700;
    }

    .roll-btn {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
    }

    .roll-btn:hover {
      background: linear-gradient(135deg, #7175f3 0%, #5b54ec 100%);
      transform: translateY(-2px);
    }

    .roll-btn:active {
      transform: translateY(1px);
    }

    .hint {
      margin-top: 14px;
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Roll a Dice</h1>

    <div class="dice-container">
      <!-- Default face: 1 -->
      <div class="dice face-1" id="dice">
        <div class="pip"></div>
      </div>
    </div>

    <div class="result-text" id="result">
      Click Roll or Tap Dice!
    </div>

    <button type="button" class="roll-btn" id="rollBtn">Roll Dice</button>
    <div class="hint">Press Spacebar to roll</div>
  </div>

  <script>
    // 1. Get references to HTML elements
    const dice = document.getElementById('dice');
    const rollBtn = document.getElementById('rollBtn');
    const result = document.getElementById('result');

    // 2. HTML templates for each dice face (1 to 6)
    const diceFaces = {
      1: '<div class="pip"></div>',
      2: '<div class="pip"></div><div class="pip"></div>',
      3: '<div class="pip"></div><div class="pip"></div><div class="pip"></div>',
      4: '<div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div>',
      5: '<div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div>',
      6: '<div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div>'
    };

    // 3. Roll function
    function rollDice() {
      // Add shake animation class
      dice.classList.add('rolling');
      result.textContent = 'Rolling...';

      // Wait 500ms for the animation to finish
      setTimeout(function() {
        // Generate a random number between 1 and 6
        const randomNumber = Math.floor(Math.random() * 6) + 1;

        // Update the dice class and inner HTML dots
        dice.className = 'dice face-' + randomNumber;
        dice.innerHTML = diceFaces[randomNumber];

        // Update result text
        result.innerHTML = 'You rolled: <span>' + randomNumber + '</span>';

        // Remove rolling class so it can be re-triggered next time
        dice.classList.remove('rolling');
      }, 500);
    }

    // 4. Event listeners for button click, dice click, and spacebar press
    rollBtn.addEventListener('click', rollDice);
    dice.addEventListener('click', rollDice);

    window.addEventListener('keydown', function(event) {
      if (event.code === 'Space') {
        event.preventDefault();
        rollDice();
      }
    });
  </script>
</body>
</html>
